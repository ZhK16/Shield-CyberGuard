    let currentDeck = 'cyberguard';
    let currentSlide = 0;

    function renderSlide() {
      const slide = decks[currentDeck][currentSlide];
      const frame = document.getElementById('slideFrame');
      document.getElementById('slideNum').textContent = `${String(currentSlide + 1).padStart(2, '0')} / 10`;

      frame.innerHTML = `
        <div class="slide-tag">${slide.tag}</div>
        <div class="slide-title">${slide.title}</div>
        <div class="slide-subtitle">${slide.subtitle}</div>
        <div class="slide-body">
          ${slide.content}
        </div>
        <div class="slide-footer">
          <div>🛡 Банк ЦентрКредит · Питч-дек 2026</div>
          <span>Интеграции и данные демо смоделированы</span>
        </div>
      `;
    }

    function switchDeck(deckName) {
      currentDeck = deckName;
      currentSlide = 0;
      document.querySelectorAll('.deck-tab').forEach(tab => {
        tab.classList.toggle('active', tab.getAttribute('onclick').includes(deckName));
      });
      renderSlide();
    }

    function nextSlide() {
      if (currentSlide < decks[currentDeck].length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    // Initial render
    renderSlide();
  </script>
